<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Réalisation & Photographie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- En-tête : Bande Démo -->
    <header class="hero">
        <div class="hero-content">
            <h1>Mon Portfolio</h1>
            <p>Cadrage | Montage | Photographie</p>
        </div>
        <!-- Remplace l'ID "VOTRE_ID_VIDEO" par l'ID de ta vidéo YouTube -->
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/VOTRE_ID_VIDEO?autoplay=1&mute=1&loop=1&playlist=VOTRE_ID_VIDEO" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>
    </header>

    <!-- Section Galerie Asymétrique -->
    <section class="gallery-section">
        <h2>Travaux Photographiques</h2>
        <div class="masonry-grid">
            <!-- Remplace le lien 'src' par le chemin vers tes propres images exportées -->
            <div class="masonry-item"><img src="https://via.placeholder.com/600x800/1a1a1a/8a2be2?text=Concept+Urbex" alt="Photo 1"></div>
            <div class="masonry-item"><img src="https://via.placeholder.com/800x600/1a1a1a/2ecc71?text=Concept+Forêt" alt="Photo 2"></div>
            <div class="masonry-item"><img src="https://via.placeholder.com/600x900/1a1a1a/8a2be2?text=Cadrage" alt="Photo 3"></div>
            <div class="masonry-item"><img src="https://via.placeholder.com/800x800/1a1a1a/2ecc71?text=Projet+Couleurs" alt="Photo 4"></div>
            <div class="masonry-item"><img src="https://via.placeholder.com/600x700/1a1a1a/8a2be2?text=Portrait" alt="Photo 5"></div>
            <div class="masonry-item"><img src="https://via.placeholder.com/800x500/1a1a1a/2ecc71?text=Set+Design" alt="Photo 6"></div>
        </div>
    </section>

    <!-- Section À propos & Contact -->
    <section class="about-section">
        <h2>À propos</h2>
        <p>Étudiant en production audiovisuelle et cinéma. Spécialisé dans l'image, la régie et les workflows de post-production.</p>
        <!-- Remplace l'adresse email par la tienne -->
        <a href="mailto:ton.email@exemple.com" class="btn-contact">Me contacter</a>
    </section>

    <footer>
        <p>© 2026 - Portfolio Indépendant</p>
    </footer>
</body>
</html>
